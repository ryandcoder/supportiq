server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # single-page app: /data-quality and /upload must also serve index.html on refresh
  location / {
    try_files $uri /index.html;
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
