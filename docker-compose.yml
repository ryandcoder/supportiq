# docker compose up --build
#   frontend  http://localhost:5173
#   API docs  http://localhost:8000/docs
# Settings come from the .env file in this folder.
services:
  db:
    image: postgres:16-alpine
    container_name: supportiq-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432"   # lets scripts on your computer reach the database
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: supportiq-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      DATA_QUALITY_PATH: /app/runtime/data_quality_report.json
      ALLOW_UPLOAD: ${ALLOW_UPLOAD:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      RELOAD_DATA: ${RELOAD_DATA:-false}
    volumes:
      - ./data:/app/data:ro        # your CSV files
      - reports:/app/runtime
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: supportiq-web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  pgdata:
  reports:
